[project]
name = "kante"
version = "2.1.0"
description = ""
authors = [{ name = "jhnnsrs", email = "jhnnsrs@gmail.com" }]
requires-python = ">=3.12, <4.0"
readme = "README.md"
license = "MIT"
dependencies = [
    "django>=6",
    "channels>=4.3.2",
    "strawberry-graphql-django==0.82",
    "strawberry-graphql[channels]==0.312",
    "channels-redis>=4.3.0",
    "cross-web==0.4.1",
]



[tool.mypy]
exclude = ["venv/", "tests/", "examples/"]
plugins = ["mypy_django_plugin.main","pydantic.mypy"]
ignore_missing_imports = true
strict = true


[tool.hatch.build.targets.sdist]
include = ["kante"]

[tool.hatch.build.targets.wheel]
include = ["kante"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.django-stubs]
django_settings_module = "test_project.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "test_project.settings"
asyncio_default_fixture_loop_scope = "function"



[tool.ruff]


# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

# Same as Black.
line-length = 100

# Assume Python 3.12.
target-version = "py312"

[tool.ruff.lint]
extend-select = ["ANN", "D1"]
# kante is a pass-through layer over strawberry: it forwards **kwargs it does not
# interpret, and stores extension payloads it does not model. Annotating those as
# anything narrower than Any would be a lie.
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
# The test suite and the demo project are not public API; docstring and
# annotation rules apply to the library itself.
"tests/*" = ["ANN", "D1"]
"test_app/*" = ["ANN", "D1"]
"test_project/*" = ["ANN", "D1"]
"manage.py" = ["ANN", "D1"]
"tmanage.py" = ["ANN", "D1"]

[tool.uv]
dev-dependencies = [
    "authentikate==0.5.0",
    "daphne>=4.1.2",
    "django-stubs>=5.2.0",
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.1.1",
    "pytest-django>=4.11.1",
    "pytest>=8.3.5",
    "python-semantic-release>=9.21.1",
    "ruff>=0.11.8",
]


[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
upload_to_pypi = true
branch = "main"
build_command = "uv build"

